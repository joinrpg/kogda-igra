; OPcache в PHP 8.5 встроен и включён по умолчанию, здесь — настройки под прод.
opcache.enable=1
; Код в образе неизменяем — не проверять mtime файлов на каждый запрос.
; Для локальной разработки (bind mount public_html/) docker-compose.yml
; выставляет PHP_OPCACHE_VALIDATE_TIMESTAMPS=1, чтобы правки были видны сразу.
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq=0
opcache.memory_consumption=64
opcache.max_accelerated_files=4000
