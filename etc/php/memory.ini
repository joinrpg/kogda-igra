; Лимит памяти на один запрос (issue #114). Контейнер в prod ограничен 128Mi, из них
; 55–75 МБ занимает обычный режим (Apache + OPcache). При дефолтных 128M один тяжёлый
; запрос убивал под через OOM killer; теперь он падает с «Allowed memory size exhausted»
; (URL виден в логе), а под остаётся жив.
; Самые тяжёлые страницы (год, выгрузка в Excel, поиск) берут 2–18 МБ на данных
; в несколько раз больше реальных.
memory_limit = 32M
