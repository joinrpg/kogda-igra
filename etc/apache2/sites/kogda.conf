ServerName localhost

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
      Options -Indexes +FollowSymLinks +MultiViews
      AllowOverride All
      Require all granted
    </Directory>

    <Location "/info.php">
        Require all denied
    </Location>

    # Несуществующий *.php (сканеры: /phpinfo.php, /wp-login.php…) — сразу 404.
    # Иначе хендлер из docker-php.conf отдаёт его mod_php, и тот пишет
    # в лог [php:error] "script ... not found or unable to stat".
    # ErrorDocument из .htaccess сюда не доходит: правило срабатывает раньше.
    ErrorDocument 404 /404/
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule \.php$ - [R=404]

    # Logs.
    CustomLog /dev/stdout combined
    ErrorLog /dev/stderr
    LogLevel debug authz_core:info
</VirtualHost>
