ServerName localhost

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
      Options -Indexes +FollowSymLinks +MultiViews
      AllowOverride All
      Require all granted
    </Directory>

    <Location "/info.php">
        Require all denied
    </Location>

    # Несуществующий *.php (сканеры: /phpinfo.php, /wp-login.php…) — сразу 404.
    # Иначе хендлер из docker-php.conf отдаёт его mod_php, и тот пишет
    # в лог [php:error] "script ... not found or unable to stat".
    # ErrorDocument из .htaccess сюда не доходит: правило срабатывает раньше.
    ErrorDocument 404 /404/
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule \.php$ - [R=404]

    # Реальный IP клиента: traefik передаёт его в X-Forwarded-For,
    # доверяем заголовку только от адресов подов кластера.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.10.0.0/16

    # Logs. %a вместо %h: с %h в логе остаётся адрес соединения (traefik).
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined_remoteip
    CustomLog /dev/stdout combined_remoteip
    ErrorLog /dev/stderr
    # PHP Deprecated идут уровнем info, error_log() — notice; остальным модулям хватит notice
    LogLevel notice php:info
</VirtualHost>
