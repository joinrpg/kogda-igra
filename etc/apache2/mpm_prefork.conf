# Лимиты prefork под контейнер с 128Mi памяти (issue #114).
# По умолчанию до 150 процессов, живущих вечно, — каждый держит свою память PHP.
# Трафик — 10–25 запросов в минуту, 10 воркеров хватает с запасом.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    MaxRequestWorkers       10
    MaxConnectionsPerChild 500
</IfModule>
