name: Deploy to dev (auto)
on:
  workflow_run:
    workflows: [Build and publish]
    types: [completed]
    branches: [master]

concurrency:
  group: development
  cancel-in-progress: true

jobs:
  deploy:
    # Только push: «Build and publish» запускается и на pull_request, а у PR из форка ветка
    # тоже может называться master — без проверки события такой PR запустил бы деплой с секретами.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' }}
    # Не шире, чем запрашивает deploy_reusable_workflow.yml: права вызывающего джоба ограничивают вызываемый workflow
    permissions:
      contents: read
    uses: ./.github/workflows/deploy_reusable_workflow.yml
    with:
      deployVersion: latest
      environment: kogda-dev
      environment_url: https://dev.kogda-igra.ru
    secrets: inherit
