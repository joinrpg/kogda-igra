name: Build and publish

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - v**
  workflow_dispatch:

env:
  APP_NAME: kogda-igra

jobs:
  lint:
    name: Lint PHP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.3'
          tools: composer
      - run: composer install --no-ansi --no-interaction --prefer-dist
      - run: composer cs-check

  # Compat-тесты из kogda-igra-net против образа, собранного из этого коммита.
  # Тесты читают схему БД из /db-init образа, так что изменения схемы тоже проверяются.
  compat-tests:
    name: Compat tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      KOGDA_IGRA_IMAGE: kogda-igra:compat-tests
    steps:
      - uses: actions/checkout@v7

      - name: Build kogda-igra image
        run: docker build . --tag ${KOGDA_IGRA_IMAGE}

      - name: Checkout kogda-igra-net
        uses: actions/checkout@v7
        with:
          repository: joinrpg/kogda-igra-net
          path: kogda-igra-net

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: kogda-igra-net/global.json
          cache: true
          cache-dependency-path: kogda-igra-net/Directory.Packages.props

      # Аргументы после "--" — для Microsoft.Testing.Platform (TUnit), см. kogda-igra-net.
      # Если сайт не поднялся, в CI тесты падают, а не пропускаются.
      - name: Test
        working-directory: kogda-igra-net
        run: dotnet test -c Release -- --results-directory ./TestResults

      - name: Save test results to artifacts
        uses: actions/upload-artifact@v7  # HTML-отчёт TUnit
        if: success() || failure()        # и при упавших тестах тоже
        with:
          name: compat-test-results
          path: kogda-igra-net/TestResults

  build:
    name: Build and publish
    needs: compat-tests  # не публиковать (и не деплоить на dev) образ, на котором тесты упали
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      checks: write
      actions: write
      statuses: write

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch the whole repo history

    # TODO: Make GitHub Action from this script
    - name: Git Version  # Fills env.CALCULATED_VERSION and env.CALCULATED_VERSION_IS_RELEASE
      id: version
      run:  iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/AntonSmolkov/HandyPoshScripts/v1.0.2/DevOps/SemVerCalc_GitHubFlow_Actions.ps1'))
      shell: pwsh
      env:
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}

    - name: Restore docker images cache
      uses: satackey/action-docker-layer-caching@v0.0.11
      continue-on-error: true

    #Rest of the pipeline implies write api privileges and can't be run on PRs

    - name: Build kogda-igra image
      if: github.event_name != 'pull_request'
      run: docker build . --tag ${APP_NAME} --label "runnumber=${GITHUB_RUN_ID}"

    - name: Log in to docker registry
      if: github.event_name != 'pull_request'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

    - name: Push portal image to docker registry
      if: github.event_name != 'pull_request'
      run: |
        APP_IMAGE_ID=ghcr.io/${{ github.repository_owner }}/${APP_NAME}

        # Change all uppercase to lowercase
        APP_IMAGE_ID=$(echo ${APP_IMAGE_ID} | tr '[A-Z]' '[a-z]')
        VERSION=$(echo ${{ env.CALCULATED_VERSION }}  | tr '[A-Z]' '[a-z]')

        docker tag ${APP_NAME} ${APP_IMAGE_ID}:${VERSION}
        docker push ${APP_IMAGE_ID}:${VERSION}

        if [[ "${{ env.CALCULATED_VERSION_IS_RELEASE }}" == "True" ]]
        then
          docker tag ${APP_NAME} ${APP_IMAGE_ID}:latest
          docker push ${APP_IMAGE_ID}:latest
        fi
