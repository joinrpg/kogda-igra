# Имя workflow используется в deploy_dev_auto.yml (workflow_run) — не переименовывать.
name: Build and publish

on:
  pull_request:
    branches:
      - master
  # Очередь слияния проверяет PR на этом событии; без него обязательные проверки в очереди не запустятся
  merge_group:
  push:
    branches:
      - master
    tags:
      - v**
  workflow_dispatch:

env:
  APP_NAME: kogda-igra
  # Образ передаётся между джобами артефактом: на PR из форков нет прав на запись в ghcr.io.
  # Поэтому публикуется ровно тот образ, на котором прошли тесты, а не пересобранный.
  IMAGE_ARTIFACT: kogda-igra-image

jobs:
  lint:
    name: Lint PHP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.3'
          tools: composer
      - run: composer install --no-ansi --no-interaction --prefer-dist
      - run: composer cs-check

  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build kogda-igra image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ env.APP_NAME }}
          labels: runnumber=${{ github.run_id }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Compat-тесты из kogda-igra-net против образа, собранного из этого коммита.
  # Тесты читают схему БД из /db-init образа, так что изменения схемы тоже проверяются.
  compat-tests:
    name: Compat tests
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # найти PR по коммиту в очереди слияния и в master
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      KOGDA_IGRA_IMAGE: kogda-igra  # = APP_NAME, тег из джоба build
    steps:
      # Изменение, которое намеренно меняет поведение, ломает тесты из master kogda-igra-net,
      # а поправленные тесты не пройдут против ещё не опубликованного образа. Поэтому тесты
      # берутся из ветки kogda-igra-net с тем же именем, что и ветка PR, если такая есть.
      # Ветку PR ищем на всех этапах — в PR, в очереди слияния и после слияния в master:
      # иначе после слияния тесты снова пойдут из master kogda-igra-net и образ не опубликуется.
      # Порядок: влить PR здесь (образ уходит в latest), затем PR в kogda-igra-net.
      - name: Pick kogda-igra-net branch
        id: tests-ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}  # из PR, может прийти из форка — только через env
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          branch=""
          case "$EVENT_NAME" in
            pull_request)
              branch="$HEAD_REF" ;;
            merge_group)
              # refs/heads/gh-readonly-queue/master/pr-123-<sha>
              pr=$(sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$MERGE_GROUP_REF")
              [ -n "$pr" ] && branch=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.ref) ;;
            push)
              [ "$REF_TYPE" = branch ] && branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                --jq '[.[] | select(.merged_at != null)][0].head.ref // empty') ;;
            workflow_dispatch)
              branch="$REF_NAME" ;;
          esac

          ref=master
          if [ -n "$branch" ] && [ "$branch" != master ] && git check-ref-format --branch "$branch" > /dev/null 2>&1 \
             && git ls-remote --exit-code --heads https://github.com/joinrpg/kogda-igra-net.git "refs/heads/$branch" > /dev/null; then
            ref="$branch"
          fi
          echo "Тесты kogda-igra-net из ветки: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"


      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}

      - name: Load kogda-igra image
        run: docker load --input ${{ runner.temp }}/image.tar

      - name: Checkout kogda-igra-net
        uses: actions/checkout@v7
        with:
          repository: joinrpg/kogda-igra-net
          ref: ${{ steps.tests-ref.outputs.ref }}
          path: kogda-igra-net

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: kogda-igra-net/global.json
          cache: true
          cache-dependency-path: kogda-igra-net/Directory.Packages.props

      # Аргументы после "--" — для Microsoft.Testing.Platform (TUnit), см. kogda-igra-net.
      # Если сайт не поднялся, в CI тесты падают, а не пропускаются.
      - name: Test
        working-directory: kogda-igra-net
        run: dotnet test -c Release -- --results-directory ./TestResults

      - name: Save test results to artifacts
        uses: actions/upload-artifact@v7  # HTML-отчёт TUnit
        if: success() || failure()        # и при упавших тестах тоже
        with:
          name: compat-test-results
          path: kogda-igra-net/TestResults

  publish:
    name: Publish
    needs: compat-tests  # не публиковать (и не деплоить на dev) образ, на котором тесты упали
    # Не на PR (нет прав на запись) и не в очереди слияния (её временные ветки публиковать незачем)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch the whole repo history

    # TODO: Make GitHub Action from this script
    - name: Git Version  # Fills env.CALCULATED_VERSION and env.CALCULATED_VERSION_IS_RELEASE
      id: version
      run:  iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/AntonSmolkov/HandyPoshScripts/v1.0.2/DevOps/SemVerCalc_GitHubFlow_Actions.ps1'))
      shell: pwsh
      env:
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}

    - uses: actions/download-artifact@v8
      with:
        name: ${{ env.IMAGE_ARTIFACT }}
        path: ${{ runner.temp }}

    - name: Load kogda-igra image
      run: docker load --input ${{ runner.temp }}/image.tar

    - name: Log in to ghcr.io
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

    - name: Log in to Selectel Container Registry
      uses: docker/login-action@v4
      with:
        registry: cr.selcloud.ru
        username: ${{ secrets.SELECTEL_CR_USERNAME }}
        password: ${{ secrets.SELECTEL_CR_PASSWORD }}

    # Образ публикуется в два реестра:
    # - ghcr.io — публичный, оттуда его анонимно тянут внешние потребители
    #   (compat-тесты kogda-igra-net, в т.ч. на PR из форков). Не убирать.
    # - cr.selcloud.ru — Selectel Container Registry, из него деплоится кластер.
    - name: Push kogda-igra image to docker registries
      run: |
        VERSION=$(echo ${{ env.CALCULATED_VERSION }}  | tr '[A-Z]' '[a-z]')

        # Change all uppercase to lowercase
        GHCR_IMAGE_ID=$(echo ghcr.io/${{ github.repository_owner }}/${APP_NAME} | tr '[A-Z]' '[a-z]')
        # Реестр в Selectel называется joinrpg независимо от владельца репозитория
        SELECTEL_IMAGE_ID=cr.selcloud.ru/joinrpg/${APP_NAME}

        for APP_IMAGE_ID in ${GHCR_IMAGE_ID} ${SELECTEL_IMAGE_ID}
        do
          docker tag ${APP_NAME} ${APP_IMAGE_ID}:${VERSION}
          docker push ${APP_IMAGE_ID}:${VERSION}

          if [[ "${{ env.CALCULATED_VERSION_IS_RELEASE }}" == "True" ]]
          then
            docker tag ${APP_NAME} ${APP_IMAGE_ID}:latest
            docker push ${APP_IMAGE_ID}:latest
          fi
        done
