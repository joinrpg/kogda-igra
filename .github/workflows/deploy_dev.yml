name: Deploy to dev
on:
  workflow_dispatch:
    inputs:
      deployVersion:
        description: Docker image to deploy
        required: true
        default: latest

concurrency:
  group: development
  cancel-in-progress: true

jobs:
  deploy:
    # Не шире, чем запрашивает deploy_reusable_workflow.yml: права вызывающего джоба ограничивают вызываемый workflow
    permissions:
      contents: read
    uses: ./.github/workflows/deploy_reusable_workflow.yml
    with:
      deployVersion: ${{ github.event.inputs.deployVersion }}
      environment: kogda-dev
      environment_url: https://dev.kogda-igra.ru
    secrets: inherit
