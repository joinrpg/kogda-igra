# Служебный домен (*.tsarevs.ru) параллельно основному. Отдельный Ingress — отдельный сертификат:
# если основной домен ещё смотрит на другой кластер, его сертификат не выпустится, а этот — выпустится.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kogda-igra-service-domain
spec:
  hostnames:
    - override-me.tsarevs.ru
  parentRefs:
    - name: main
      namespace: infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kogda-igra
          port: 80
