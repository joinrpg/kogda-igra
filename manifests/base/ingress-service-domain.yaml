# Служебный домен (*.tsarevs.ru) параллельно основному. Отдельный Ingress — отдельный сертификат:
# если основной домен ещё смотрит на другой кластер, его сертификат не выпустится, а этот — выпустится.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kogda-igra-service-domain
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - override-me.tsarevs.ru
      secretName: override-me-tsarevs-ru-tls
  rules:
    - host: override-me.tsarevs.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kogda-igra
                port:
                  number: 80
