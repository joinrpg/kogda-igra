apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kogda-igra
spec:
  hostnames:
    - override-me.ru
  parentRefs:
    - name: main
      namespace: infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kogda-igra
          port: 80
