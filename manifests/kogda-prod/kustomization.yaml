resources:
  - ../base

namespace: kogda-prod

commonLabels:
  managed-by-kogda-igra-kogda-prod: "true"
  #Careful. Contains name of the environment, used for kubectl apply --prune
  #On deploy everything with this label will be considered managed by this manifests and will be replaced by prune
  #Everything without this label will not be changed.

patchesJson6902:
  - target:
      kind: HTTPRoute
      group: gateway.networking.k8s.io
      version: v1
      name: kogda-igra
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: kogda-igra.ru
      - op: add
        path: /spec/hostnames/1
        value: www.kogda-igra.ru
      - op: add
        path: /spec/hostnames/2
        value: prod.kogda-igra.ru

  - target:
      kind: HTTPRoute
      group: gateway.networking.k8s.io
      version: v1
      name: kogda-igra-service-domain
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: kogda-igra.tsarevs.ru

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kogda-igra
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/cpu
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 300m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi

  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: kogda-igra
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
